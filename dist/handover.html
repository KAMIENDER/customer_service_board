<!DOCTYPE html>

<head>
  <meta charset="UTF-8">

  <!-- Google Fonts -->

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Custom Styles -->
  <script type="module" crossorigin src="/assets/js/handover-CKHgE_OY.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/js/auth-D8aRKfxS.js">
  <link rel="modulepreload" crossorigin href="/assets/js/api-B5MdEqPF.js">
  <link rel="stylesheet" crossorigin href="/assets/css/auth-DydB8eX2.css">
</head>
<body>
  <div class="app-container">
    <!-- 侧边栏 -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">🤖</div>
        <h1 class="sidebar-title">AI 客服中心</h1>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section">
          <a href="index.html" class="nav-item">
            <span class="nav-item-icon">📊</span>
            <span>接待效率</span>
          </a>
          <a href="handover.html" class="nav-item active">
            <span class="nav-item-icon">🎯</span>
            <span>转人工维度</span>
          </a>
          <a href="coverage.html" class="nav-item">
            <span class="nav-item-icon">💬</span>
            <span>回复内容</span>
          </a>
        </div>

        <div class="nav-section">
          <div class="nav-section-title">配置管理</div>
          <a href="knowledge-base.html" class="nav-item">
            <span class="nav-item-icon">📚</span>
            <span>知识库管理</span>
          </a>
          <a href="#" class="nav-item">
            <span class="nav-item-icon">⚙️</span>
            <span>规则引擎</span>
          </a>
          <a href="#" class="nav-item">
            <span class="nav-item-icon">📜</span>
            <span>训练历史</span>
          </a>
        </div>
      </nav>

      <div class="sidebar-footer">
        <div class="user-info">
          <div class="user-avatar">李</div>
          <div class="user-details">
            <div class="user-name">李明</div>
            <div class="user-role">管理员</div>
          </div>
        </div>
      </div>
    </aside>

    <!-- 主内容区 -->
    <main class="main-content">
      <header class="top-header">
        <div class="breadcrumb">
          <a href="index.html" class="breadcrumb-item">首页</a>
          <span class="breadcrumb-separator">/</span>
          <span class="breadcrumb-current">转人工维度</span>
        </div>

        <div class="header-actions">
          <div class="date-filter">
            <button class="date-btn" data-range="yesterday">昨日</button>
            <button class="date-btn active" data-range="7days">近7日</button>
            <div class="date-custom-wrapper">
              <button class="date-btn date-custom-btn" data-range="custom">自定义</button>
              <div class="date-picker-dropdown" id="date-picker-dropdown">
                <div class="date-picker-header">选择日期范围</div>
                <div class="date-picker-inputs">
                  <div class="date-input-group">
                    <label>开始日期</label>
                    <input type="date" id="date-start" class="date-input">
                  </div>
                  <span class="date-separator">至</span>
                  <div class="date-input-group">
                    <label>结束日期</label>
                    <input type="date" id="date-end" class="date-input">
                  </div>
                </div>
                <div class="date-picker-actions">
                  <button class="date-picker-cancel" id="date-picker-cancel">取消</button>
                  <button class="date-picker-confirm" id="date-picker-confirm">确定</button>
                </div>
              </div>
            </div>
          </div>
          <button class="btn-primary">
            <span>📥</span>
            导出报告
          </button>
          <button class="icon-btn">🔄</button>
        </div>
      </header>

      <div class="page-content">
        <div class="page-header">
          <h2 class="page-title">转人工关注维度</h2>
          <p class="page-subtitle">聚焦整体转人工表现与核心场景占比，支持转人工分类优化</p>
        </div>

        <div class="stats-grid" style="grid-template-columns: repeat(3, 1fr); margin-bottom: 24px;">
          <div class="stat-card" style="background: linear-gradient(135deg, #EEF2FF 0%, #E0E7FF 100%);">
            <div class="stat-header">
              <div class="stat-icon" style="background: rgba(99, 102, 241, 0.2); color: #6366F1;">👥</div>
            </div>
            <div class="stat-label">整体转人工数量</div>
            <div class="stat-value" id="handover-total">0</div>
          </div>

          <div class="stat-card" style="background: linear-gradient(135deg, #ECFEFF 0%, #CFFAFE 100%);">
            <div class="stat-header">
              <div class="stat-icon" style="background: rgba(6, 182, 212, 0.2); color: #0891B2;">📈</div>
            </div>
            <div class="stat-label">整体转人工率</div>
            <div class="stat-value small"><span id="handover-rate">0</span><span class="stat-suffix">%</span></div>
          </div>

          <div class="stat-card" style="background: linear-gradient(135deg, #FEE2E2 0%, #FECACA 100%);">
            <div class="stat-header">
              <div class="stat-icon red">❓</div>
            </div>
            <div class="stat-label">无法回答转人工人数</div>
            <div class="stat-value" id="handover-no-answer">0</div>
          </div>
        </div>

        <div class="table-container handover-scene-section">
          <div class="table-header">
            <div>
              <h3 class="table-title">各场景转人工数量 / 率</h3>
              <p class="table-subtitle">态度问题、用户拒绝发图、物流售后、知识库问答找不到知识</p>
            </div>
          </div>
          <div class="table-scroll">
            <table class="data-table">
              <thead>
                <tr>
                  <th>转人工场景</th>
                  <th>描述</th>
                  <th>转人工数量</th>
                  <th>场景占比</th>
                  <th>状态</th>
                </tr>
              </thead>
              <tbody id="handover-scene-table-body">
                <!-- 动态生成 -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- 认证模态框 -->
  <div id="auth-modal" class="auth-modal">
    <div class="auth-modal-content" style="position: relative;">
      <div class="auth-modal-header">
        <button class="auth-modal-close">✕</button>
        <div class="auth-modal-logo">🤖</div>
        <h2 class="auth-modal-title">欢迎使用 AI 客服中心</h2>
        <p class="auth-modal-subtitle">登录以访问完整功能</p>
      </div>

      <div class="auth-modal-body">
        <form id="login-form" class="auth-form">
          <div class="form-group">
            <label class="form-label">邮箱</label>
            <input type="email" id="login-email" class="form-input" placeholder="请输入邮箱" required>
          </div>
          <div class="form-group">
            <label class="form-label">密码</label>
            <input type="password" id="login-password" class="form-input" placeholder="请输入密码" required>
          </div>
          <div id="auth-error" class="auth-error"></div>
          <button type="submit" class="auth-submit-btn">登录</button>
          <div class="auth-switch">
            还没有账号？<a id="switch-to-register">立即注册</a>
          </div>
        </form>

        <form id="register-form" class="auth-form" style="display: none;">
          <div class="form-group">
            <label class="form-label">邮箱</label>
            <input type="email" id="register-email" class="form-input" placeholder="请输入邮箱" required>
          </div>
          <div class="form-group">
            <label class="form-label">密码</label>
            <input type="password" id="register-password" class="form-input" placeholder="请输入密码（至少6位）" required minlength="6">
          </div>
          <div class="form-group">
            <label class="form-label">确认密码</label>
            <input type="password" id="register-confirm-password" class="form-input" placeholder="请再次输入密码" required>
          </div>
          <div id="auth-error" class="auth-error"></div>
          <button type="submit" class="auth-submit-btn">注册</button>
          <div class="auth-switch">
            已有账号？<a id="switch-to-login">立即登录</a>
          </div>
        </form>
      </div>
    </div>
  </div>

</body>
</html>
